name: Print Software Versions

on:
  push:
    branches: [ main ]

jobs:
  PrintDataProcessingVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print .NET Version (.NET / OpenCV Runtime)
        run: dotnet --version
      - name: Print .NET SDK Info
        run: dotnet --info

  PrintDatabaseVersions:
    runs-on: ubuntu-latest
    needs: [PrintDataProcessingVersions]
    steps:
      - name: Print SQLite Version (Database Server SQLite / JSON)
        run: sqlite3 --version
